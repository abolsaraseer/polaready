<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5EFEB">
<title>Your PolaReady photos</title>
<link rel="icon" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400..900&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--navy:#233345;--cream:#F5EFEB;--paper:#FBF8F5;--glacier:#3F7A9C;--gold:#B8935A;--soft:#56606C;--ash:#E4DFDA;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--cream);color:var(--navy);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
img{display:block;max-width:100%}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:9px;font-family:'Fugaz One';font-size:19px;text-decoration:none;color:inherit}
.brand i{width:28px;height:28px;background:var(--navy);-webkit-mask:url(../assets/mark.svg) center/contain no-repeat;mask:url(../assets/mark.svg) center/contain no-repeat}
.code{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;color:var(--soft)}
.hi{font-family:'Instrument Serif';font-style:italic;font-size:22px;color:var(--soft)}
h1{font-family:'Fugaz One';font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1;letter-spacing:-.01em;margin:4px 0 6px}
.meta{color:var(--soft);font-size:14.5px}
.paperbox{margin:26px auto 18px;display:flex;justify-content:center;perspective:900px}
.paperimg{width:min(220px,58vw);box-shadow:0 22px 50px rgba(20,30,45,.28);transform:rotate(-2deg);background:#fff;border-radius:2px}
.develop{animation:develop 3.2s var(--ease) both}
@keyframes develop{0%{filter:brightness(2.4) contrast(.3) saturate(0) blur(6px);opacity:.2}35%{opacity:1}100%{filter:none}}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:52px;border-radius:999px;background:var(--navy);color:var(--cream);font-weight:800;font-size:16px;border:0;cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),background .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--ash)}
.btn svg{width:20px;height:20px}
.hint{text-align:center;color:var(--soft);font-size:13px;margin:10px 0 0}
.sec{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:30px 0 12px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#e9e2dc;aspect-ratio:3/2;opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.ph.in{opacity:1;transform:none}
.ph img{width:100%;height:100%;object-fit:cover}
.ph a{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--navy);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ph a svg{width:18px;height:18px}
.state{text-align:center;padding:40px 10px}
.bear{width:84px;height:84px;margin:0 auto 18px;background:var(--navy);-webkit-mask:url(../assets/mark.svg) center/contain no-repeat;mask:url(../assets/mark.svg) center/contain no-repeat;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.state h2{font-family:'Fugaz One';font-weight:400;font-size:26px;line-height:1.1;margin-bottom:8px}
.state p{color:var(--soft);max-width:330px;margin:0 auto}
.dots{display:inline-flex;gap:5px;margin-top:16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--glacier);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:none}}
.book{margin-top:40px;background:var(--navy);color:var(--cream);border-radius:20px;padding:22px;display:flex;gap:16px;align-items:center;text-decoration:none}
.book i{width:44px;height:44px;flex:none;background:var(--cream);-webkit-mask:url(../assets/mark.svg) center/contain no-repeat;mask:url(../assets/mark.svg) center/contain no-repeat}
.book b{display:block;font-size:16px}
.book span{font-size:13.5px;color:#B9C3CE}
.rule{height:3px;width:44px;background:var(--gold);border-radius:2px;margin:14px 0}
.fade{animation:fade .8s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ph{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="https://polaready.com/"><i></i>PolaReady</a><span class="code" id="code"></span></header>
  <main id="main"><div class="state"><div class="bear"></div><div class="dots"><i></i><i></i><i></i></div></div></main>
  <a class="book fade" href="https://polaready.com/" style="animation-delay:.6s"><i></i><div><b>Loved the booth?</b><span>Book PolaReady for your own event →</span></div></a>
</div>
<script src="../admin/config.js?v=1"></script>
<script src="guest.js?v=1"></script>
</body>
</html>
